<!doctype html>
<html>
<head><meta charset="utf-8"><title>Microcopy Lab</title>
<link rel="stylesheet" href="ui.css">
<style>
  body{width:340px}
  header{padding:12px 14px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  main{padding:12px 14px;display:grid;gap:12px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
  .stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px}
  .stats b{display:block;font-size:17px}
  .stats span{font-size:11px;color:var(--muted);line-height:1.2;display:block}
  footer{padding:0 14px 14px;display:grid;gap:8px}
  footer button{width:100%}
  .brand{display:flex;align-items:center;gap:8px}
  .brand img{width:20px;height:20px}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand grow"><img src="icons/icon32.png" alt=""><h1 style="font-size:15px">Microcopy Lab</h1></div>
    <label class="switch" id="enabledWrap" data-i18n-title="popupToggleTitle" hidden><input type="checkbox" id="enabled"><span></span></label>
  </div>
  <div class="small muted" style="margin-top:4px"><span id="host" class="host"></span> <span id="tableInfo"></span></div>
</header>

<main id="stUnsupported" hidden>
  <div class="msg info" data-i18n="popupUnsupported"></div>
</main>

<main id="stInactive" hidden>
  <p style="margin:0" data-i18n="popupInactive"></p>
  <button id="enableSite" class="primary"></button>
  <div class="small muted" data-i18n="popupPermissionHint"></div>
</main>

<main id="stActive" hidden>
  <section>
    <div class="label" data-i18n="popupVariant"></div>
    <div class="seg" id="variants"></div>
    <div id="noTable" class="small muted" style="margin-top:6px" data-i18n="popupNoTable" hidden></div>
  </section>
  <section id="pageSection">
    <div class="label"><span data-i18n="popupThisPage"></span> <span id="page" class="pill"></span></div>
    <div class="stats">
      <div><b id="sReplaced">–</b><span data-i18n="statReplaced"></span></div>
      <div><b id="sEmpty">–</b><span data-i18n="statEmpty"></span></div>
      <div><b id="sUnknown">–</b><span data-i18n="statUnknown"></span></div>
    </div>
  </section>
  <section>
    <label class="row"><input type="checkbox" id="highlight"> <span class="grow" data-i18n="popupHighlight"></span></label>
    <div class="legend small muted" style="margin-top:4px">
      <i style="background:#16a34a"></i><span data-i18n="legendOk"></span><i style="background:#2563eb"></i><span data-i18n="legendEmpty"></span><i style="background:#eab308"></i><span data-i18n="legendUnknown"></span>
    </div>
  </section>
  <button id="collect" class="primary" data-i18n="popupCollect"></button>
  <button id="refresh" data-i18n="popupRefreshSheet" hidden></button>
</main>

<div style="padding:0 14px"><div id="msg" class="msg" hidden></div></div>
<footer style="margin-top:10px">
  <button id="manage" data-i18n="popupManage"></button>
</footer>
<script src="lib/i18n.js"></script>
<script src="lib/core.js"></script>
<script src="popup.js"></script>
</body>
</html>
